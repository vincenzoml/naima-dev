# verify on Deno, the documented runtime; the same tests on Node and Bun.
# Every job needs Deno: the distribution tests run Naima through its launcher.
# The full history is fetched so the tracker's locked commit is here, and the
# program is cloned from this repository's own objects, without the network.

name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task verify

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "src/**/*.test.ts"

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: bun test src
