# The project site (https://vincenzoml.github.io/naima/), built here and
# published by the product: site/ as it is on main, with the product's star
# count written in by scripts/site.ts at build time, pushed as one commit to
# the orphan branch gh-pages of github.com/vincenzoml/naima, whose Pages
# serves that branch. The page fetches nothing at runtime.
#
# The push uses a deploy key with write access on the product; its private
# half is this repository's secret PRODUCT_DEPLOY_KEY. The installer clones
# the product with --single-branch, so gh-pages never reaches a project.

name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site.ts", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false # the site needs no product file
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Build the site
        run: |
          # The product's star count, when the API answers; without it the page shows no count.
          stars=$(curl -fsS "https://api.github.com/repos/vincenzoml/naima" | grep -m1 '"stargazers_count"' | tr -dc 0-9 || true)
          deno run -A scripts/site.ts _site ${stars:+--stars "$stars"}
      - name: Push it to the product's gh-pages
        env:
          PRODUCT_DEPLOY_KEY: ${{ secrets.PRODUCT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$PRODUCT_DEPLOY_KEY" > ~/.ssh/id_product && chmod 600 ~/.ssh/id_product
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd _site && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name="naima-dev pages" -c user.email="pages@users.noreply.github.com" commit -q -m "Site from naima-dev ${GITHUB_SHA}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_product -o IdentitiesOnly=yes" git push -q --force git@github.com:vincenzoml/naima.git gh-pages
